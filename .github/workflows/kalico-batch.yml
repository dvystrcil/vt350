name: kalico-batch
# printer.cfg against the CAD logs, then the same config through real Kalico batch mode in the kalisim image
# (vt350#116 AC1-AC4, run here for AC6). See cad/klipper/README.md.
on:
  pull_request:
    paths:
      - cad/klipper/**
      - platform/kalisim/**
      - platform/klipper/**
      - platform/virtualprinter/**
      - cad/data/logs/z_sweep.log
      - cad/data/logs/sweep_toolhead.log
      - .github/workflows/kalico-batch.yml
  push:
    branches: [main]
    paths:
      - cad/klipper/**
      - platform/kalisim/**
      - platform/klipper/**
      - platform/virtualprinter/**
      - cad/data/logs/z_sweep.log
      - cad/data/logs/sweep_toolhead.log
      - .github/workflows/kalico-batch.yml
  # repin-virtualprinter.yml starts this on its own branches (a push made with GITHUB_TOKEN starts no runs)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Test printer.cfg's limits against the CAD logs (limits.py; no Kalico)
        run: python3 cad/klipper/test_limits.py 2>&1 | tee test-limits.log
      - name: Confirm every limits test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-limits.log && tail -1 test-limits.log | grep -qx 'OK'
      - name: Test the tool-change params against the CAD dock poses (dock_params.py; no Kalico)
        run: python3 cad/klipper/test_dock_params.py 2>&1 | tee test-dock-params.log
      - name: Confirm every dock-params test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-dock-params.log && tail -1 test-dock-params.log | grep -qx 'OK'
      - name: Test the vendored purge macro and its settings
        run: python3 cad/klipper/test_purge.py 2>&1 | tee test-purge.log
      - name: Confirm every purge test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-purge.log && tail -1 test-purge.log | grep -qx 'OK'
      - name: Test the front-end switch and the vendored client configs (frontend.py; no Kalico)
        run: python3 platform/klipper/test_frontend.py 2>&1 | tee test-frontend.log
      - name: Confirm every front-end test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-frontend.log && tail -1 test-frontend.log | grep -qx 'OK'
      - name: Test the pin-map generator (pinmap.py; no Kalico)
        run: python3 platform/klipper/test_pinmap.py 2>&1 | tee test-pinmap.log
      - name: Confirm every pin-map test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-pinmap.log && tail -1 test-pinmap.log | grep -qx 'OK'
      - name: Check the pin map covers every pin in printer.cfg (vt350#224 AC3)
        run: |
          python3 platform/klipper/pinmap.py check --config cad/klipper/printer.cfg --map cad/klipper/pinmap.json \
            | tee pinmap.log
          tail -1 pinmap.log | grep -qx 'pinmap: OK'
      # Kalico's thermistor list at the kalisim image's commit, so a heater's sensor_type is judged as the container
      # judges it. The unit tests (test-tmp.yml) cover a fake [heater_bed] failing this check.
      - name: Check the virtual printer covers printer.cfg, pins and heaters (vt350#224)
        run: |
          sha=$(sed -n 's/^ARG KALICO_SHA=//p' platform/kalisim/Dockerfile)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/temperature_sensors.cfg" \
            "https://raw.githubusercontent.com/KalicoCrew/kalico/$sha/klippy/extras/temperature_sensors.cfg"
          python3 platform/virtualprinter/prepare.py --check --source . --config cad/klipper/printer.cfg \
            --map cad/klipper/pinmap.json --sensors "$RUNNER_TEMP/temperature_sensors.cfg" | tee vp-check.log
          tail -1 vp-check.log | grep -qx 'virtual-printer: check OK'
      - name: Test the batch-mode runner against a fake klippy (kalisim; no Kalico)
        run: python3 platform/kalisim/test_kalisim.py 2>&1 | tee test-kalisim.log
      - name: Confirm every kalisim test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-kalisim.log && tail -1 test-kalisim.log | grep -qx 'OK'
      - name: Build the kalisim image and run the Kalico batch-mode tests in it
        run: bash cad/klipper/test_in_container.sh 2>&1 | tee test-batch.log
      - name: Confirm the batch-mode run reached the end
        run: |
          tail -1 test-batch.log | grep -qx 'kalico-batch: OK'
      # FROM the kalisim image just built: every virtual-printer pin (snapshot apt versions, simulavr commit and tree
      # sha256, pip hashes, Fluidd sha256) is checked by building it (vt350#224)
      - name: Build the virtual-printer image FROM it
        run: |
          docker build -q --build-arg KALISIM_IMAGE=vt350-kalisim:local --build-context pinmap=platform/klipper \
            -t virtual-printer:ci platform/virtualprinter
