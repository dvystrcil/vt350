name: printed-parts
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Test the printed-parts check
        run: python3 platform/parts/test_check_printed.py
      - name: Check parts/printed against its manifest and bom/printed-parts.md
        run: python3 platform/parts/check-printed.py | tee check.log
      - name: Confirm the check ran to the end
        run: |
          grep -qx 'check-printed: OK' check.log
