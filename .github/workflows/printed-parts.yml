name: printed-parts
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Test the printed-parts check
        run: python3 platform/parts/test_check_printed.py
      - name: Check parts/printed against its manifest and bom/printed-parts.md
        run: python3 platform/parts/check-printed.py | tee check.log
      - name: Confirm the check ran to the end
        run: |
          grep -qx 'check-printed: OK' check.log
      # vt350#40: each assembly page's generated Print/Buy tables match the manifest and bom/bom.csv
      - name: Test the per-step parts tables generator
        run: python3 platform/docs/test_step_parts.py
      - name: Check the per-step parts tables in docs/assembly
        run: python3 platform/docs/step_parts.py --check | tee step-parts.log
      - name: Confirm the step-parts check ran to the end
        run: |
          grep -qx 'step-parts: OK' step-parts.log
      # vt350#268: the parts library (cad/library/): every source.json valid, every file listed with its sha256,
      # nothing committed for a no-file entry, REUSE.toml and cad/credits.json agreeing with each entry
      - name: Test the library check
        run: python3 platform/library/test_check_library.py
      - name: Check the parts library
        run: |
          set -o pipefail
          python3 platform/library/check_library.py --library cad/library --reuse REUSE.toml --projects cad/credits.json --manifest parts/printed/manifest.csv | tee library.log
      - name: Confirm the library check ran to the end
        run: |
          grep -qx 'library-check: OK' library.log
