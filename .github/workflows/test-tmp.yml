name: Tests and tools clean up their temp dirs
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # ffmpeg: platform/render/test_motion.py encodes a real video (vt350#135). Without it that test skips, and a
      # skip is not the bare "OK" the check below accepts.
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      # Each test file runs with its own empty TMPDIR. Anything left behind fails the check: leaked test dirs once
      # filled the laptop's /tmp (a tmpfs, 1M inodes).
      - name: Run every python3 test file with an empty TMPDIR
        run: bash platform/testing/check_test_tmp.sh 2>&1 | tee check.log
      - name: Assert the completion marker
        run: |
          grep -qx 'check-test-tmp: OK' check.log
      # The tools themselves (most need FreeCAD, so they can't run here) are checked by reading them: every
      # mkdtemp/mkstemp/mktemp needs a cleanup in the same function or file, or a `# tmp-kept: <reason>` marker.
      # The shared action asserts its own completion marker. https://github.com/dvystrcil/tmp-cleanup-action
      - name: Check every tool removes the temp dirs it makes
        uses: dvystrcil/tmp-cleanup-action@v1
