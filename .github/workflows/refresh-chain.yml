name: refresh-chain
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Test the after-a-model-change chain (sync, step runner, summary)
        run: python3 cad/scripts/test_refresh.py 2>&1 | tee test.log
      - name: Confirm every test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test.log && tail -1 test.log | grep -qx 'OK'
      - name: Test where derive_stls reads its models from (the batch lane sets VT350_MODELS)
        run: python3 cad/scripts/test_derive_stls.py 2>&1 | tee test-derive.log
      - name: Confirm every derive_stls test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-derive.log && tail -1 test-derive.log | grep -qx 'OK'
      - name: Test the outcome a pass shows when it ends (outcome.py, #280; plain python3)
        run: python3 platform/freecad/test_outcome.py 2>&1 | tee test-outcome.log
      - name: Confirm every outcome test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-outcome.log && tail -1 test-outcome.log | grep -qx 'OK'
      - name: Test the check workers' pool and worker count (litepool, #45; plain python3 workers)
        run: python3 platform/freecad/test_litepool.py 2>&1 | tee test-litepool.log
      - name: Confirm every litepool test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-litepool.log && tail -1 test-litepool.log | grep -qx 'OK'
      - name: Test clashlib's job dir is removed on every path (fake workers)
        run: python3 platform/freecad/test_clashlib.py 2>&1 | tee test-clashlib.log
      - name: Confirm every clashlib test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-clashlib.log && tail -1 test-clashlib.log | grep -qx 'OK'
      - name: Test where the platform scripts' settings come from (batchvalues; env var, then values file, then default)
        run: python3 platform/freecad/test_batchvalues.py 2>&1 | tee test-batchvalues.log
      - name: Confirm every batchvalues test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-batchvalues.log && tail -1 test-batchvalues.log | grep -qx 'OK'
      - name: Test the coil fit behind the spring stand-ins (standins, #195 AC3; no FreeCAD)
        run: python3 platform/freecad/test_standins.py 2>&1 | tee test-standins.log
      - name: Confirm every standins test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-standins.log && tail -1 test-standins.log | grep -qx 'OK'
      - name: Test sweep_toolhead's plan stage removes its temp dir (fake freecadcmd)
        run: python3 cad/studies/test_sweep_toolhead.py 2>&1 | tee test-sweep.log
      - name: Confirm every sweep_toolhead test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-sweep.log && tail -1 test-sweep.log | grep -qx 'OK'
      - name: Test the front-reach bisection and box filter (front_reach, #291; no FreeCAD)
        run: python3 cad/studies/test_front_reach.py 2>&1 | tee test-front-reach.log
      - name: Confirm every front_reach test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-front-reach.log && tail -1 test-front-reach.log | grep -qx 'OK'
      - name: Test the Beacon coverage map (front_reach_map, #291; committed SVG current)
        run: python3 cad/studies/test_front_reach_map.py 2>&1 | tee test-front-reach-map.log
      - name: Confirm every front_reach_map test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-front-reach-map.log && tail -1 test-front-reach-map.log | grep -qx 'OK'
      - name: Test the Beacon offset study's pose maths (beacon_offset, #291; no FreeCAD)
        run: python3 cad/studies/test_beacon_offset.py 2>&1 | tee test-beacon-offset.log
      - name: Confirm every beacon_offset test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-beacon-offset.log && tail -1 test-beacon-offset.log | grep -qx 'OK'
      - name: Test the dock-row analysis (dock_layout, #19 AC2; no FreeCAD)
        run: python3 cad/studies/test_dock_layout.py 2>&1 | tee test-dock.log
      - name: Confirm every dock_layout test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-dock.log && tail -1 test-dock.log | grep -qx 'OK'
      - name: Test the serial-vs-parallel proof runner (prove_parallel, #45; fake freecadcmd)
        run: python3 cad/studies/test_prove_parallel.py 2>&1 | tee test-prove.log
      - name: Confirm every prove_parallel test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-prove.log && tail -1 test-prove.log | grep -qx 'OK'
      - name: Test the Z sweep's contact search (contact.py, #82; no FreeCAD)
        run: python3 platform/freecad/test_contact.py 2>&1 | tee test-contact.log
      - name: Confirm every contact test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-contact.log && tail -1 test-contact.log | grep -qx 'OK'
      - name: Test the STEP-to-model registration (register.py, #6; no FreeCAD)
        run: python3 platform/freecad/test_register.py 2>&1 | tee test-register.log
      - name: Confirm every register test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-register.log && tail -1 test-register.log | grep -qx 'OK'
      - name: Test the bowden tube's route curve and handle search (bezier.py, #6; no FreeCAD)
        run: python3 platform/freecad/test_bezier.py 2>&1 | tee test-bezier.log
      - name: Confirm every bezier test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-bezier.log && tail -1 test-bezier.log | grep -qx 'OK'
      - name: Test the Z sweep's envelope documents, probe grid and limit lines (z_sweep.py, #82; no FreeCAD)
        run: python3 cad/studies/test_z_sweep.py 2>&1 | tee test-z-sweep.log
      - name: Confirm every z_sweep test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-z-sweep.log && tail -1 test-z-sweep.log | grep -qx 'OK'
      - name: Test the tool-change clash study's timeline handling (toolchange_clash, #116 AC5; no FreeCAD)
        run: python3 cad/studies/test_toolchange_clash.py 2>&1 | tee test-toolchange.log
      - name: Confirm every toolchange_clash test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-toolchange.log && tail -1 test-toolchange.log | grep -qx 'OK'
      - name: Test the per-part box index's schema, staleness and --check (part_index, #90; no FreeCAD)
        run: python3 platform/freecad/test_part_index.py 2>&1 | tee test-part-index.log
      - name: Confirm every part_index test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-part-index.log && tail -1 test-part-index.log | grep -qx 'OK'
      - name: Test the group paths shared by the part index and the render export (linkgeo.group_parents, #220)
        run: python3 platform/freecad/test_group_parents.py 2>&1 | tee test-group-parents.log
      - name: Confirm every group_parents test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-group-parents.log && tail -1 test-group-parents.log | grep -qx 'OK'
      - name: Install numpy + scipy for the cable rod model (the only scipy user)
        run: python3 -m pip install --user --break-system-packages numpy scipy
      - name: Test the flap + guide cable rod model (gradients, catenary, segment distance; #3)
        run: python3 cad/studies/flap_guide/test_rod.py 2>&1 | tee test-flap-guide.log
      - name: Confirm every flap_guide test ran
        run: grep -qE '^Ran [1-9][0-9]* tests' test-flap-guide.log && tail -1 test-flap-guide.log | grep -qx 'OK'
