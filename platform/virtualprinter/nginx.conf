# Fluidd's static files, and Moonraker behind the same port (vt350#224): the usual Fluidd + Moonraker layout (Fluidd's
# docs/installation), run as the image's non-root user, so every path nginx writes is under /tmp/virtualprinter.
worker_processes 1;
pid /tmp/virtualprinter/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/virtualprinter/nginx-body;
    proxy_temp_path /tmp/virtualprinter/nginx-proxy;
    fastcgi_temp_path /tmp/virtualprinter/nginx-fastcgi;
    uwsgi_temp_path /tmp/virtualprinter/nginx-uwsgi;
    scgi_temp_path /tmp/virtualprinter/nginx-scgi;
    client_max_body_size 0;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream moonraker { server 127.0.0.1:7125; }
    server {
        listen 8080;
        root /opt/fluidd;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
        location = /index.html { add_header Cache-Control "no-store, no-cache, must-revalidate"; }
        location /websocket {
            proxy_pass http://moonraker/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }
        location ~ ^/(printer|api|access|machine|server)/ {
            proxy_pass http://moonraker$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Scheme $scheme;
            # /printer/gcode/script answers when the G-code finishes: a tool change takes minutes on simulavr
            proxy_read_timeout 3600;
        }
    }
}
