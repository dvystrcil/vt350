# Pinned profile for parts/slice-check.py (#70): PETG, 0.4 nozzle, 0.2 layers, supports automatic for overhangs
# flatter than 45 deg from horizontal (PrusaSlicer support_material_threshold: no support where the slope angle,
# 90 = vertical, is above it). Bed = this printer's plate (355 square). Loaded over PrusaSlicer's built-in defaults
# with an empty --datadir, so no GUI preset leaks in. Only check-relevant keys here: change one, re-check every part.
printer_technology = FFF
bed_shape = 0x0,355x0,355x355,0x355
max_print_height = 340
nozzle_diameter = 0.4
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 25%
filament_type = PETG
filament_diameter = 1.75
temperature = 240
first_layer_temperature = 240
bed_temperature = 80
first_layer_bed_temperature = 80
support_material = 1
support_material_auto = 1
support_material_threshold = 45
support_material_buildplate_only = 0
gcode_flavor = klipper
gcode_comments = 0
