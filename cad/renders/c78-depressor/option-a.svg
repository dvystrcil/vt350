<text x="20" y="22" font-size="14" font-weight="bold">vt350#78 Option A: a finger on the left XY joint (rides with the gantry). Boxes from lite-81, Left head carried.</text>
<text x="20" y="42">Lever tip = nozzle X -38.06. Throw 9.0 mm (AFC default 8.5 + 0.5; measure on the real cutter). Finger face X -445.1: lever touches at nozzle X -407.0, fully pressed at the travel limit -416.</text>
<text x="20" y="78" fill="#b00">Clash: the slot 1 dock holds its head at nozzle X -409.7, lever tip X -447.8; this finger would press that lever 2.7 mm at pickup (a cut at the dock).</text>
<text x="20" y="60">Cost: printing must stay right of nozzle X -406.0 (1 mm margin), so the left edge moves 10.0 mm in: 342.0 to 332.0 mm wide.</text>
<text x="60" y="113" font-weight="bold">PLAN, looking down (back of the printer at the top)</text>
