# VT350 nozzle offsets: MadMax's offset-calibration macros, with the Mellow MultiHead Zero as the probe (vt350#186).
#
# Macro source: MadMax Configs/r2pdx_config-v2-Kalico-Beacon-2025-07-05/klipper-toolchanger/tc_offset_calibration_macros.cfg
# at zruncho3d/madmax@277a63cbb696f937fbf9d883a8d8c46a658cd6d9 (GPL-3.0, by Joseph Greiner), vendored unchanged in
# madmax/. It is included first; this file then repeats sections to override them (Kalico keeps the last value of a
# repeated option).
#
# Why the three macros below are replaced: MadMax's copies read printer.tools_calibrate.last_x_result, last_y_result
# and last_z_result. klipper-toolchanger's tools_calibrate module reports those, but the build runs Kalico's own
# tools_calibrate (vt350#116, option A), whose get_status() has only sensor_location, last_result (an x, y, z named
# tuple) and calibration_probe_inactive. MadMax's copies therefore stop with "UndefinedError: 'dict object' has no
# attribute 'last_x_result'" and save nothing (run in Kalico batch mode; an earlier note here said they'd save 0
# silently, which reading the source suggested but running disproved). These copies read last_result.x / .y / .z
# instead, and stop with an error if there is no result yet. test_kalico_batch.py (TcOffsets) checks the saved values.

[include madmax/tc_offset_calibration_macros.cfg]

[tools_calibrate]
# The Mellow MultiHead Zero: a normally-closed microswitch, like Nudge, so no inversion (klipper-toolchanger
# tools_calibrate.md: "normally closed: nudge (no inversion)"); the pull-up holds the input high when the switch
# opens on contact.
# Wired to an endstop input on the Octopus (owner, 2026-11-17, vt350#186). PG11 is the Octopus Pro's DIAG3 (Kalico
# config/generic-bigtreetech-octopus-pro-v1.1.cfg), the first endstop input printer.cfg doesn't use (X PG6, Y PG9,
# Z PG10); PG12..PG15 are free too, if it's plugged in elsewhere. The cable route from the bed isn't decided.
pin: ^PG11

[save_variables]
# MadMax's path, kept. The file starts as a copy of madmax/offset_save_file.cfg (vendored unchanged).
filename: ~/printer_data/config/offset_save_file.cfg

[gcode_macro _TC_SHOW_LAST_RESULT]
description: Show the last results from tools_calibrate or tool_locate_sensor
gcode:
    {% set r = printer.tools_calibrate.last_result %}
    {% if r is none %}
      {action_raise_error("tools_calibrate has no result yet: run TOOL_LOCATE_SENSOR or TOOL_CALIBRATE_TOOL_OFFSET")}
    {% endif %}
    RESPOND MSG="X: {r.x|float|round(3)}  Y: {r.y|float|round(3)} Z: {r.z|float|round(3)}"

[gcode_macro _TC_SAVE_PROBE_POSITION]
description: Update the nudge position from the last probe sequesnce.
gcode:
    {% set r = printer.tools_calibrate.last_result %}
    {% if r is none %}
      {action_raise_error("tools_calibrate has no result yet: run TOOL_LOCATE_SENSOR first")}
    {% endif %}
    # Update the variables that hold the offsets
    SAVE_VARIABLE VARIABLE=nudge_position_x VALUE={r.x|float|round(3)}
    SAVE_VARIABLE VARIABLE=nudge_position_y VALUE={r.y|float|round(3)}
    # Add 3mm to the Z height, we don't want to crash a nozzle into the probe.
    SAVE_VARIABLE VARIABLE=nudge_position_z VALUE={r.z|float|round(3) + 3}
    # Notify the user that the coordinates have been saved.
    RESPOND MSG="X: {r.x|float|round(3)}  Y: {r.y|float|round(3)} Z: {r.z|float|round(3) + 3.000}"
    RESPOND MSG="Nudge coordinates saved as:"

[gcode_macro _TC_UPDATE_OFFSETS]
description: Update the offsets gotten from the last probe sequesnce.
gcode:
    {% set r = printer.tools_calibrate.last_result %}
    {% set tool_number = params.TOOL|int %}
    {% if r is none %}
      {action_raise_error("tools_calibrate has no result yet: run TOOL_CALIBRATE_TOOL_OFFSET first")}
    {% endif %}
    # Kalico's TOOL_LOCATE_SENSOR leaves the sensor's position in last_result; only TOOL_CALIBRATE_TOOL_OFFSET
    # replaces it with an offset. If they are the same, the offset run didn't happen or failed: don't save a position
    # as an offset.
    {% if r == printer.tools_calibrate.sensor_location %}
      {action_raise_error("last_result is the sensor position, not an offset: TOOL_CALIBRATE_TOOL_OFFSET did not run")}
    {% endif %}
    # Update the variables that hold the offsets
    SAVE_VARIABLE VARIABLE={'t' + tool_number|string + '_offset_x'} VALUE={r.x|float|round(3)}
    SAVE_VARIABLE VARIABLE={'t' + tool_number|string + '_offset_y'} VALUE={r.y|float|round(3)}
    SAVE_VARIABLE VARIABLE={'t' + tool_number|string + '_offset_z'} VALUE={r.z|float|round(3)}
    # Show us the saved offsets
    RESPOND MSG="X: {r.x|float|round(3)}  Y: {r.y|float|round(3)} Z: {r.z|float|round(3)}"
    # Apply the offsets to The tool
    SET_GCODE_OFFSET X={r.x|float|round(3)} Y={r.y|float|round(3)} Z={r.z|float|round(3)} MOVE=1

# Applying the offsets on a tool change (vt350#186). The T<n> macros (toolchanger.cfg) call _CHANGE_TOOL (madmax/
# toolchanger_macros.cfg, vendored unchanged): it clears the old tool's offsets (keeping any Z tweak made since),
# selects the new tool, applies its saved t<n>_offset_x/y/z with SET_GCODE_OFFSET, and moves the part-fan speed to it.
# Without these, klipper-toolchanger's own T<n> selects the tool and the saved offsets are never used.
# _CHANGE_TOOL reads every offset from the save file, so a missing one (a fresh install, before the file is copied
# from madmax/offset_save_file.cfg) would stop it part-way with a Jinja error: _CHECK_SAVED_OFFSETS stops first, and
# says what to do.
[gcode_macro _CHECK_SAVED_OFFSETS]
description: Stop unless the save file has every tool's x, y and z offset
gcode:
    {% set svf = printer.save_variables.variables %}
    {% set missing = [] %}
    {% for t in printer.toolchanger.tool_numbers %}
      {% for a in "xyz" %}
        {% if ("t%d_offset_%s" % (t, a)) not in svf %}{% set _ = missing.append("t%d_offset_%s" % (t, a)) %}{% endif %}
      {% endfor %}
    {% endfor %}
    {% if missing %}
      {action_raise_error("the offset save file has no %s: copy madmax/offset_save_file.cfg to ~/printer_data/config/offset_save_file.cfg" % (missing|join(", ")))}
    {% endif %}
