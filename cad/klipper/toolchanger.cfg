# VT350 tool changer: MadMax's macros, unchanged, with the VT350's dock positions (vt350#116 AC4).
#
# Macro source (owner decision, vt350#116, 2026-11-10): MadMax Configs/r2pdx_config-v2-Kalico-Beacon-2025-07-05 at
# zruncho3d/madmax@277a63cbb696f937fbf9d883a8d8c46a658cd6d9 (GPL-3.0), vendored unchanged in madmax/. They run on
# viesturz/klipper-toolchanger@94756dfde9b729fd69f9b8780067821c5c99a528 (GPL-3.0), which the kalisim image installs.
#
# The two MadMax files are included first. This file then repeats [toolchanger] to override MadMax's dock positions
# (Kalico keeps the last value of a repeated option), and adds the VT350's two [tool]s.
# cad/klipper/dock_params.py derives every params_* below from the CAD and fails if this file differs.
#
# Printer coordinates are the PROPOSED mapping in xy_mapping.json (vt350#116): X = model X + 420.0, Y = model Y - 30.5.
# The docks are at the front, below Y 0: the dock-zone Y (position_min -82.43) is only safe at these X positions.

[include madmax/toolchanger_macros.cfg]
[include madmax/toolchanger.cfg]

[toolchanger]
# source: cad/data/logs/sweep_toolhead.log "own dock pickup slid 6.0 mm forward to the keyslots' large opening":
#         docked nozzle Y -32.46 - 6.0 = model Y -38.46, printer Y -68.96
params_attach_y: -68.96
# Not in the CAD: MadMax's distance from its own parked Y, kept. MadMax parks at its attach_y + the 6.0 mm slide
# (-7 + 6 = -1). The VT350 parks at model Y -32.46 (sweep_toolhead.log "docked nozzle tip"), printer Y -62.96.
# source: madmax/toolchanger.cfg params_close_y 15 = parked + 16 -> -62.96 + 16
params_close_y: -46.96
# source: madmax/toolchanger.cfg params_safe_shuttle_y 35 = parked + 36 -> -62.96 + 36. UNCHECKED: a clearance for
#         MadMax's heads, not the VT350's; vt350#116 AC5 clash-checks it on the model.
params_safe_shuttle_y: -26.96
# source: madmax/toolchanger.cfg params_safe_toolhead_y 110 = parked + 111 -> -62.96 + 111. UNCHECKED, as above.
params_safe_toolhead_y: 48.04
# MadMax's start-up runs _INITIALIZE_FROM_DETECTED_TOOL, which reads a [gcode_button tool<n>_detect] per tool. The
# O2S tool-detect inputs aren't decided (PLACEHOLDER), so the VT350 starts with no tool on the carriage, as in the
# model (both heads docked). INITIALIZE_TOOLCHANGER T=<n> still selects a tool without moving.
initialize_gcode:
  RESPOND TYPE=echo MSG='VT350: no tool detection yet (PLACEHOLDER): starting with both heads docked'

[tool T0]
# The left head: Orbitool O2S "o2s_left", [extruder]
tool_number: 0
extruder: extruder
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
# source: cad/data/logs/sweep_toolhead.log "Left: docked nozzle tip (-399.00, -32.46, 380.80)"; X = model X + 420.0
params_park_x: 21.00
# source: madmax toolboard_0.cfg params_park_x 42 -> params_detach_x 47: 5 mm away from the keyslot plate. The left
#         head's plate is on its -X side (cad/passes/lite23_cowl_docks.py: left = -X dock side), so +X.
params_detach_x: 26.00

[tool T1]
# The right head: Orbitool O2S "o2s_right", [extruder1]
tool_number: 1
extruder: extruder1
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
# source: cad/data/logs/sweep_toolhead.log "Right: docked nozzle tip (-92.00, -32.46, 380.80)"; X = model X + 420.0
params_park_x: 328.00
# source: madmax toolboard_1.cfg params_park_x 435 -> params_detach_x 440: 5 mm away from the keyslot plate. The right
#         head is the mirror image, its plate on its +X side (lite23_cowl_docks.py), so -X.
params_detach_x: 323.00
