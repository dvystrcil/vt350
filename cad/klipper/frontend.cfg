# The VT350's web front end: Fluidd (owner, 2026-11-10). Included by printer.cfg.
#
# The include brings in the front end's client config, vendored unchanged in platform/klipper/frontends/:
# [virtual_sdcard] (path ~/printer_data/gcodes, which klipper-toolchanger also needs), [pause_resume],
# [display_status], [respond] and the PAUSE / RESUME / CANCEL_PRINT macros.
#
# To use Mainsail instead, either edit the line below or run:
#   python3 platform/klipper/frontend.py --config cad/klipper/frontend.cfg --use mainsail
# test_kalico_batch.py runs the tool changes under both, so either one loads with this config.
[include ../../platform/klipper/frontends/fluidd/client.cfg]
