# Tool 0: the Left head. Its Orbitool O2S toolboard, extruder and part fan. Included by printer.cfg; the [tool T0]
# section itself is in toolchanger.cfg, with the dock positions.
#
# Pins from the body of Orbiter-Toolboards @ 52a5a33 "Kipper Config/Orbitool_O2S.cfg" v1.0.0 (CC0-1.0; its header
# comments disagree with its body, and the body is what the pinout PDF shows).

[mcu o2s_left]
# Orbitool O2S toolboard, STM32F072, left head. Firmware: cad/klipper/kconfig/o2s-left.config.
# Upstream (Orbiter-Toolboards @ 52a5a33, CC0-1.0) gives every board the serial "Orbitool_O2S", so two boards would
# share one /dev/serial/by-id name. Each head's firmware gets its own.
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_Orbitool_O2S_L-if00
restart_method: command

# Orbiter v2.5 extruder, ATC Semitec 104GT-2 thermistor as upstream.
[extruder]
step_pin: o2s_left:PB3
dir_pin: !o2s_left:PB4
enable_pin: !o2s_left:PC14
microsteps: 32
rotation_distance: 4.69
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: o2s_left:PB9
sensor_pin: o2s_left:PA1
pullup_resistor: 2200
sensor_type: ATC Semitec 104GT-2
min_temp: 0
max_temp: 300
min_extrude_temp: 20
max_power: 0.995
control: pid
pid_Kp: 25.566
pid_Ki: 1.794
pid_Kd: 91.080

# The part-cooling fan, named as MadMax's macros expect: _CHANGE_TOOL moves the fan speed to the new tool's
# part_fan_t<n>, and MadMax's M106/M107 drive the current tool's (vt350#186). Pins from the same upstream file's
# "2 and 3 wire part fan configuration" (its default): PWM on PA10 (inverted), the fan's power switched by PB14.
# PLACEHOLDER: the part fans aren't chosen yet; a 4-wire fan would use upstream's other block (PB0, not inverted).
[fan_generic part_fan_t0]
pin: !o2s_left:PA10
enable_pin: o2s_left:PB14
off_below: 0.2
