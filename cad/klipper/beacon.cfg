# The Beacon RevH (eddy-current scanner + nozzle contact) on the MadMax carriage, its bed mesh and the Z tilt (vt350#291).
# NOT included by printer.cfg yet: Kalico batch mode (cad/klipper/test_kalico_batch.py) can't load [beacon] (the
# beacon_klipper module and the Beacon's MCU dictionary aren't in the kalisim image). Include it when the Beacon is
# wired. cad/motion/beacon_scan.py reads this file for the start-of-print video, so the video shows these values.
#
# Roles (owner, 2026-11-21/22): the first Z home is coarse, by proximity, with no head on the carriage (the Beacon is on
# the carriage; there's no nozzle yet). With a head picked up, the nozzle taps for Z_TILT_ADJUST and for the true Z0.
# The bed mesh comes from the Beacon's proximity scan, not from taps.
# PLACEHOLDER/PROPOSED values wait on vt350#291 (the front reach; the owner chooses the mesh limits).

[beacon]
# PLACEHOLDER: the Beacon's serial id
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_PLACEHOLDER-if00
# The coil centre less the nozzle, from the model (lite24_beacon.py, lite-26; vt350#54 AC2), not a calibration
x_offset: 0
y_offset: 27.4
# The first home has no head on the carriage, so it can only be proximity; contact is asked for by name afterwards
# (G28 Z METHOD=CONTACT CALIBRATE=1)
home_method: proximity
# PROPOSED: the plate centre. Beacon's home_xy_position is the nozzle position for Z homing
home_xy_position: 175, 175
home_z_hop: 5
# Beacon's default, written out: the scan lines run along Y (front to back), and the auto overscan applies at the
# line ends in Y (beacon_klipper@3ccd2e6 beacon.py _handle_connect; 23.07 mm here, set by the rear room)
mesh_main_direction: y

[bed_mesh]
# PROPOSED: 300 mm/s (= max_velocity). Beacon's default is 50
speed: 300
horizontal_move_z: 5
# PROPOSED: the coil fully on the plate (vt350#291: coil radius 7.98 inside the 350 square). Probe (coil) positions
mesh_min: 5.48, 5.48
mesh_max: 344.52, 344.52
probe_count: 15, 15
zero_reference_position: 175, 175

[z_tilt]
# The bed's pivots: the three Z leadscrews in the lite-76 model, printer XY, stepper_z / z1 / z2 (front left, front
# right, rear; Leadscrew (rod) / Leadscrew001 / Leadscrew002). Klipper Config_Reference [z_tilt]: nozzle coordinates
# of each pivot.
z_positions:
    -38, 1.5
    388, 1.5
    175.2, 419.6
# Where the nozzle taps: Voron's stock Trident 350 points (VoronDesign/Voron-Trident Firmware/Octopus/
# Trident_Octopus_Config.cfg), with the front two at Y 7, not 5: on lite-77 the docked heads stop the Left nozzle at
# Y 5.04 near X 320 and the Right at 5.04 near X 30 (cad/data/front_reach.json). Y 7 keeps 2 mm of margin now and
# after lite-78 (the front 17 mm forward, vt350#291). cad/studies/test_front_reach_map.py checks every point against
# both heads' measured reach.
points:
    30, 7
    320, 7
    175, 295
speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
