# VT350 Kalico config: the values the CAD model decides, plus the minimum Kalico needs to load it (vt350#82, #116).
# The firmware is Kalico (user, 2026-11-09). The rest of the config comes with the build (stage #15).
#
# Checked in batch mode, with no hardware, by cad/klipper/test_kalico_batch.py (see cad/klipper/README.md).
# Web front end: Fluidd (frontend.cfg, owner 2026-11-10); Mainsail is the supported alternative.
# Every [stepper_*] limit comes from a committed CAD log: they are in cad_values.cfg, generated by
# `python3 cad/klipper/limits.py --cfg > cad/klipper/cad_values.cfg`, with the source above each value.
# cad/klipper/test_limits.py fails if the committed file isn't what the logs give.
#
# Layout (vt350#294, owner 2026-11-21; modelled on the owner's Neptune config): this file is the [printer] section
# and the includes, flat, one file per part of the printer. Kalico merges a section that appears in more than one file
# (cad_values.cfg fills in steppers.cfg's sections). SAVE_CONFIG writes its block at the end of this file.
#
# PLACEHOLDER marks a value the CAD doesn't decide and the user hasn't decided yet. It's there so Kalico loads.
#
# Printer coordinates, X and Y (PROPOSED in vt350#116, not yet confirmed; cad/klipper/xy_mapping.json):
#   origin  X0 Y0 = the print square's front-left corner, model (-420.0, 30.5) (sweep_toolhead.log "print square")
#   X+ = model +X (to the right), Y+ = model +Y (to the rear), so printer X = model X + 420.0, Y = model Y - 30.5
# Z0 is the nozzle tip touching the print surface (the 1.0 mm PEI spring-steel sheet, modelled from lite-77), and
# Z+ moves the bed down. Measured on the saved model by cad/studies/z_sweep.py, log cad/data/logs/z_sweep.log:
#   mechanical lower stop  Klipper Z 334.43: both bed-frame 2020s (front crossbar and spine) rest on the backbone
#   configured lower stop  Klipper Z 329.43: 5.00 mm above it (contact.FLOOR_MARGIN, user decision 2026-11-09),
#                          bed dZ -237.00 from the model pose, LDO plate top Z 48.76
#   mechanical top         Klipper Z -21.17, toolhead parked: the rear Z block on its rail stop
# A sheet of another thickness moves Z0 by the difference: change it in cad/passes (lite77_pei_sheet.py) and refresh.
# test_refresh.py fails if position_max differs from klipper_position_max_configured_mm in the committed log.

[printer]
kinematics: corexy
# PLACEHOLDER speeds: Kalico's generic-config values until the build is tuned.
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

# The main board
[include mcu.cfg]

# X, Y, Z (three Z motors)
[include steppers.cfg]

# GENERATED from the CAD logs: the steppers' limits (cad/klipper/limits.py --cfg; don't edit by hand)
[include cad_values.cfg]

# The tools: each O2S toolboard, extruder and part fan
[include t0.cfg]
[include t1.cfg]

# The web front end's client config (Fluidd; frontend.cfg says how to switch). It provides [virtual_sdcard], which
# klipper-toolchanger looks up at start-up.
[include frontend.cfg]

# The tool changer: MadMax macros on klipper-toolchanger, with the VT350 dock positions (vt350#116 AC4)
[include toolchanger.cfg]

# Nozzle offsets: MadMax's calibration macros with the Mellow MultiHead Zero, fixed for Kalico (vt350#186)
[include tc_offsets.cfg]

# The purge line: Squiggly Purge (mjonuschat/voron-mods, vendored unchanged), the same macro as the owner's Neptune.
# It goes next to the first layer when [exclude_object] knows the objects (the slicer labels them).
[include squiggly-purge/squiggly_purge.cfg]
[exclude_object]
