# VT350 Kalico config: the values the CAD model decides, plus the minimum Kalico needs to load it (vt350#82, #116).
# The firmware is Kalico (user, 2026-11-09). The rest of the config comes with the build (stage #15).
#
# Checked in batch mode, with no hardware, by cad/klipper/test_kalico_batch.py (see cad/klipper/README.md).
# Every [stepper_*] limit comes from a committed CAD log, with the source in the comment above it.
# cad/klipper/test_limits.py recomputes each one from its log and fails if they differ.
#
# PLACEHOLDER marks a value the CAD doesn't decide and the user hasn't decided yet. It's there so Kalico loads.
#
# Printer coordinates, X and Y (PROPOSED in vt350#116, not yet confirmed; cad/klipper/xy_mapping.json):
#   origin  X0 Y0 = the print square's front-left corner, model (-420.0, 30.5) (sweep_toolhead.log "print square")
#   X+ = model +X (to the right), Y+ = model +Y (to the rear), so printer X = model X + 420.0, Y = model Y - 30.5
# Z0 is the nozzle tip touching the print surface (the magnet sheet in the model: no steel sheet is modelled), and
# Z+ moves the bed down. Measured on the saved model by cad/studies/z_sweep.py, log cad/data/logs/z_sweep.log:
#   mechanical lower stop  Klipper Z 335.33: both bed-frame 2020s (front crossbar and spine) rest on the backbone
#   configured lower stop  Klipper Z 330.33: 5.00 mm above it (contact.FLOOR_MARGIN, user decision 2026-11-09),
#                          bed dZ -237.00 from the model pose, LDO plate top Z 48.76
#   mechanical top         Klipper Z -20.27, toolhead parked: the rear Z block on its rail stop
# With a steel sheet of thickness t on the magnet sheet, Z0 rises by t: subtract t from position_max.
# test_refresh.py fails if position_max differs from klipper_position_max_configured_mm in the committed log.

[mcu]
# BTT Octopus Pro v1.1, STM32H723 (bom/printed-parts.md). Firmware: cad/klipper/kconfig/octopus-pro-h723.config
# PLACEHOLDER serial: the by-id name carries the board's chip id, which is known once it is plugged in.
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_PLACEHOLDER-if00

[mcu o2s_left]
# Orbitool O2S toolboard, STM32F072, left head. Firmware: cad/klipper/kconfig/o2s-left.config.
# Upstream (Orbiter-Toolboards @ 52a5a33, CC0-1.0) gives every board the serial "Orbitool_O2S", so two boards would
# share one /dev/serial/by-id name. Each head's firmware gets its own.
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_Orbitool_O2S_L-if00
restart_method: command

[mcu o2s_right]
# Orbitool O2S toolboard, STM32F072, right head. Firmware: cad/klipper/kconfig/o2s-right.config.
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_Orbitool_O2S_R-if00
restart_method: command

[printer]
kinematics: corexy
# PLACEHOLDER speeds: Kalico's generic-config values until the build is tuned.
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

# Octopus Pro drivers as in Kalico's config/generic-bigtreetech-octopus-pro-v1.1.cfg (Driver0..Driver4).
# PLACEHOLDER: the motor-to-driver wiring is not decided (wiring docs, stage #13).
[stepper_x]
# Driver0 (CoreXY B motor)
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
# PLACEHOLDER endstop: the printed X endstop was removed in lite-10 (cad/README.md); where X homes with two O2S
# heads (each has an X-stop input, upstream uses PA2) is not decided.
endstop_pin: ^PG6
# source: cad/data/logs/sweep_toolhead.log "Left head, left side: first nozzle X with no new overlap -416.0" and
#         "Left head, right side: first nozzle X with no new overlap -74.0" (Right head: the same); X = model X + 420.0
position_min: 4.00
position_max: 346.00
position_endstop: 346.00
homing_speed: 50

[stepper_y]
# Driver1 (CoreXY A motor)
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
# PLACEHOLDER endstop (stage #15)
endstop_pin: ^PG9
# source: cad/data/logs/sweep_toolhead.log "Left carried: ... nozzle Y reach -51.93 .. 370.69" (Right carried: the
#         same); Y = model Y - 30.5. Y below 0 is the dock zone in front of the plate: the box limit lets the nozzle
#         reach it anywhere along X, so only the tool-change macros keep it to the dock positions (#116 AC4).
position_min: -82.43
position_max: 340.19
position_endstop: 340.19
homing_speed: 50

[stepper_z]
# Driver2. Integrated-leadscrew NEMA17s, T8 with 8 mm lead (notes/status.md).
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
# PLACEHOLDER endstop: Z homes on the Beacon (#114) once it is configured.
endstop_pin: ^PG10
position_endstop: 0
# Z0 is set by the Beacon nozzle tap (cad/data/logs/z_sweep.log: Z0 = the nozzle on the magnet sheet) and shifts by
# fractions of a mm per nozzle. position_min is not a CAD limit: it is how far below Z0 Kalico accepts a command, so
# per-tool Z offsets and calibration moves aren't refused (vt350#116, owner 2026-11-10). limits.py only requires it
# to be at or below the CAD floor.
# source: zruncho3d/madmax@277a63cbb696f937fbf9d883a8d8c46a658cd6d9
#   Configs/r2pdx_config-v2-Kalico-Beacon-2025-07-05/printer.cfg [stepper_z] position_min: -15 (the AC4 macro source)
position_min: -15
# source: cad/data/logs/z_sweep.log klipper_position_max_configured_mm
position_max: 330.33
homing_speed: 8

[stepper_z1]
# Driver3
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 8

[stepper_z2]
# Driver4
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 8

# The extruders, one per O2S, pins from the body of Orbiter-Toolboards @ 52a5a33 "Kipper Config/Orbitool_O2S.cfg"
# v1.0.0 (CC0-1.0; its header comments disagree with its body, and the body is what the pinout PDF shows).
# Orbiter v2.5 extruder, ATC Semitec 104GT-2 thermistor as upstream.
[extruder]
step_pin: o2s_left:PB3
dir_pin: !o2s_left:PB4
enable_pin: !o2s_left:PC14
microsteps: 32
rotation_distance: 4.69
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: o2s_left:PB9
sensor_pin: o2s_left:PA1
pullup_resistor: 2200
sensor_type: ATC Semitec 104GT-2
min_temp: 0
max_temp: 300
min_extrude_temp: 20
max_power: 0.995
control: pid
pid_Kp: 25.566
pid_Ki: 1.794
pid_Kd: 91.080

[extruder1]
step_pin: o2s_right:PB3
dir_pin: !o2s_right:PB4
enable_pin: !o2s_right:PC14
microsteps: 32
rotation_distance: 4.69
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: o2s_right:PB9
sensor_pin: o2s_right:PA1
pullup_resistor: 2200
sensor_type: ATC Semitec 104GT-2
min_temp: 0
max_temp: 300
min_extrude_temp: 20
max_power: 0.995
control: pid
pid_Kp: 25.566
pid_Ki: 1.794
pid_Kd: 91.080

[virtual_sdcard]
# klipper-toolchanger looks it up at start-up (toolchanger.py, tool-missing check); MadMax gets it from its
# mainsail.cfg. PLACEHOLDER path: Mainsail's default, until the host is set up.
path: ~/printer_data/gcodes

# The tool changer: MadMax macros on klipper-toolchanger, with the VT350 dock positions (vt350#116 AC4)
[include toolchanger.cfg]
