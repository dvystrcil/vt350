# VT350 Klipper config: values that come from the CAD model (vt350#82).
# Only the lines the model decides live here so far; the rest of the config comes with the build.
#
# Z0 is the nozzle tip touching the print surface (the magnet sheet in the model: no steel sheet is modelled).
# Measured on the saved model by cad/scripts/z_sweep.py, log cad/data/logs/z_sweep.log:
#   mechanical lower stop  Klipper Z 335.33: both bed-frame 2020s (front crossbar and spine) rest on the backbone
#   configured lower stop  Klipper Z 330.33: 5.00 mm above it (contact.FLOOR_MARGIN, user decision 2026-11-09),
#                          bed dZ -237.00 from the model pose, LDO plate top Z 48.76
#   mechanical top         Klipper Z -20.27, toolhead parked: the rear Z block on its rail stop
# With a steel sheet of thickness t on the magnet sheet, Z0 rises by t: subtract t from position_max.
# test_refresh.py fails if position_max differs from klipper_position_max_configured_mm in the committed log.

[stepper_z]
position_max: 330.33
