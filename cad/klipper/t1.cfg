# Tool 1: the Right head. Its Orbitool O2S toolboard, extruder and part fan. Included by printer.cfg; the [tool T1]
# section itself is in toolchanger.cfg, with the dock positions. Same board and pins as t0.cfg (see its notes).

[mcu o2s_right]
# Orbitool O2S toolboard, STM32F072, right head. Firmware: cad/klipper/kconfig/o2s-right.config.
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_Orbitool_O2S_R-if00
restart_method: command

# Orbiter v2.5 extruder, ATC Semitec 104GT-2 thermistor as upstream.
[extruder1]
step_pin: o2s_right:PB3
dir_pin: !o2s_right:PB4
enable_pin: !o2s_right:PC14
microsteps: 32
rotation_distance: 4.69
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: o2s_right:PB9
sensor_pin: o2s_right:PA1
pullup_resistor: 2200
sensor_type: ATC Semitec 104GT-2
min_temp: 0
max_temp: 300
min_extrude_temp: 20
max_power: 0.995
control: pid
pid_Kp: 25.566
pid_Ki: 1.794
pid_Kd: 91.080

# The part-cooling fan (see t0.cfg). PLACEHOLDER: the part fans aren't chosen yet.
[fan_generic part_fan_t1]
pin: !o2s_right:PA10
enable_pin: o2s_right:PB14
off_below: 0.2
