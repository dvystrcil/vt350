<text x="10" y="646.0">Triangle: nozzle tip at scan Z 2. Box: coil housing (17 across, face 4.6 above the bed). Trapezoid: 17 → 17.40 across at the bed.</text>
<text x="10" y="666.0">The flare is a stand-in (Beacon's keep-out cone above the board, mirrored down); Beacon publishes no downward sensing cone.</text>
